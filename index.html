const REP={
'أرصدة المخزون':async f=>({h:['الصنف','المخزن','الكمية','القيمة'],rows:(await E.stock()).filter(x=>!f.w||x.wh==f.w).map(x=>[iN(x.item),wN(x.wh),x.qty,x.value]),t:[2,3]}),
'قيمة المخزون':async f=>{const s=await E.stock();return{h:['المخزن','عدد الأصناف','القيمة'],rows:WH.map(w=>{const z=s.filter(x=>x.wh==w.id&&x.qty>0);return[w.name,z.length,z.reduce((a,x)=>a+x.value,0)]}),t:[1,2]}},
'حركة صنف':async f=>{if(!f.i)throw Error('اختر الصنف');return{h:['التاريخ','المستند','النوع','المخزن','الكمية','القيمة'],rows:(await all('moves')).filter(x=>x.item==f.i&&df(x.date,f)&&(!f.w||x.wh==f.w)).map(x=>[x.date,x.no,LAB[x.kind],wN(x.wh),x.qty,x.value]),t:[4,5]}},
'أذون الاستلام':VR('receipt'),'أذون الصرف والتحويل':MR('issue',1),'الجرد وفروق المخزون':MR('count'),'المشتريات اليومية':PUR(10),'المشتريات الشهرية':PUR(7),
'الأصناف تحت الحد الأدنى':async f=>({h:['الصنف','الرصيد','الحد الأدنى'],rows:ITEMS.filter(i=>i.active&&i.qty<=i.min).map(i=>[i.name,i.qty,i.min])}),
'كشف حساب المورد':async f=>{if(!f.s)throw Error('اختر المورد');const[v,p]=await Promise.all([all('vouchers'),all('payments')]),r=[...v.filter(x=>x.kind=='receipt'&&x.status=='posted'&&x.sup==f.s).map(x=>[x.date,x.no,'فاتورة استلام',0,x.lines.reduce((a,l)=>a+l.qty*l.price,0)]),...p.filter(x=>x.sup==f.s).map(x=>[x.date,x.code,'دفعة',x.amount,0])].sort((a,b)=>a[0]<b[0]?-1:1);let b=0;return{h:['التاريخ','المستند','النوع','مدين','دائن','الرصيد'],rows:r.map(x=>{b+=x[4]-x[3];return[...x,b]}),t:[3,4]}},
'المدفوعات':async f=>({h:['الرقم','التاريخ','المورد','الطريقة','المبلغ'],rows:(await all('payments')).filter(x=>df(x.date,f)&&(!f.s||x.sup==f.s)).map(x=>[x.code,x.date,sN(x.sup),x.method,x.amount]),t:[4]}),
'تكلفة الوصفات':async f=>({h:['الطبق','سعر البيع','تكلفة الحصة','Food Cost %','تكلفة مثبتة'],rows:(await all('recipes')).map(r=>{const p=rcost(r)/r.portions;return[r.name,r.price,p,fmt(p/r.price*100)+'%',r.snap?fmt(r.snap.cost):'-']})}),
'الأصناف القريبة من انتهاء الصلاحية':async f=>{const lim=new Date(Date.now()+30*864e5).toISOString().slice(0,10),r=[];(await all('vouchers')).filter(x=>x.kind=='receipt'&&x.status=='posted').forEach(x=>x.lines.filter(l=>l.expiry&&l.expiry<=lim).forEach(l=>r.push([l.name,x.no,l.qty,l.expiry])));return{h:['الصنف','المستند','الكمية المستلمة','الصلاحية'],rows:r}},
'الأصناف الراكدة (30 يومًا)':async f=>{const u=new Set((await all('moves')).filter(x=>x.at>Date.now()-30*864e5).map(x=>x.item));return{h:['الصنف','الرصيد','القيمة'],rows:ITEMS.filter(i=>i.qty>0&&!u.has(i.id)).map(i=>[i.name,i.qty,i.value]),t:[1,2]}},
'سجل العمليات':async f=>{if(!ME||ME.role!=='admin')throw Error('سجل العمليات متاح للمدير فقط');return{h:['الوقت','المستخدم','العملية','المرجع'],rows:(await all('audit')).reverse().slice(0,500).map(x=>[new Date(x.at).toLocaleString('ar-EG'),x.user,x.action,x.ref])}}};
let LR;pages.reports=m=>{const reportNames=Object.keys(REP).filter(k=>k!=='سجل العمليات'||ME?.role==='admin');m.innerHTML=`<h2>التقارير</h2><div class="card"><div class="bar"><select id="rs">${reportNames.map(k=>`<option>${k}</option>`).join('')}</select><input id="ra1" type="date"><input id="rb1" type="date"><select id="rw"><option value="">كل المخازن</option>${WH.map(w=>`<option value=${w.id}>${w.name}</option>`).join('')}</select><select id="rsup"><option value="">كل الموردين</option>${SUPS.map(s=>`<option value=${s.id}>${s.name}</option>`).join('')}</select><select id="rit"><option value="">الصنف</option>${ITEMS.map(i=>`<option value=${i.id}>${i.name}</option>`).join('')}</select><button onclick="runR()">عرض</button><button class="s" onclick="print()">طباعة</button><button class="s" onclick="csv()">CSV</button></div><div id="ro"></div></div>`};
async function runR(){try{const k=$('#rs').value,f={a:$('#ra1').value,b:$('#rb1').value,w:+$('#rw').value||0,s:+$('#rsup').value||0,i:+$('#rit').value||0},r=await REP[k](f);LR={k,...r};const tot=r.t?r.h.map((_,j)=>j==0?'الإجمالي':r.t.includes(j)?fmt(r.rows.reduce((a,x)=>a+ +x[j],0)):''):null;
 $('#ro').innerHTML=`<p>${k} — أُنشئ: ${new Date().toLocaleString('ar-EG')} — العملة: EGP</p>`+table(r.h,[...r.rows.map(x=>x.map(c=>typeof c=='number'?fmt(c):c)),...(tot?[tot]:[])])}catch(e){toast(e.message,1)}}
async function stmt(id){await go('reports');$('#rs').value='كشف حساب المورد';$('#rsup').value=id;runR()}
async function mvR(id){await go('reports');$('#rs').value='حركة صنف';$('#rit').value=id;runR()}
const dl=(name,text,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()};
function csv(){if(!LR)return toast('اعرض تقريرًا أولًا',1);dl(LR.k+'.csv','\ufeff'+[LR.h,...LR.rows].map(r=>r.map(c=>`"${c??''}"`).join(',')).join('\n'),'text/csv')}
pages.settings=async m=>{const us=await all('users');m.innerHTML=`<h2>الإعدادات</h2><div class="card"><p>المؤسسة: E2 — العملة: EGP — المنطقة الزمنية: Africa/Cairo</p><p><b>حالة التخزين:</b> بيانات المخزون وحسابات المستخدمين تُزامَن عبر Firebase Realtime Database. تُخزَّن كلمات المرور كقيمة مشتقة مع salt، وليس كنص واضح.</p><p><b>الحساب الحالي:</b> ${safeText(ME.username||ME.name)} — الدور: ${ME.role}</p><div class="bar"><button class="s" onclick="toggleTheme()">تغيير الوضع الداكن/الفاتح</button><button onclick="bk()">تصدير نسخة احتياطية</button><button class="s" onclick="$('#rf').click()">استعادة نسخة</button><input id="rf" type="file" accept=".json" hidden onchange="rs(this.files[0])"><button class="s" onclick="vf()">فحص سلامة الأرصدة</button></div></div><div class="card"><h3>إدارة مستخدمي النظام (Firebase)</h3><p>تُحفظ أسماء المستخدمين وكلمات المرور المجزأة والأدوار في Realtime Database تحت e2/users.</p><div class="bar"><input id="nuName" placeholder="الاسم الظاهر"><input id="nuUser" placeholder="اسم المستخدم بالإنجليزية"><input id="nuPass" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)"><select id="nuRole"><option value="owner">owner — المالك</option><option value="chef">chef — الشيف</option><option value="accountant">accountant — المحاسب</option><option value="admin">admin — المدير</option></select><button onclick="createLocalUserFromSettings()">إضافة المستخدم</button></div></div><div class="card"><h3>المستخدمون في قاعدة البيانات</h3>${table(['الاسم','اسم الدخول','الدور','الحالة','إجراء'],us.map(u=>[safeText(u.name),safeText(u.username),u.role,u.active===false?'معطل':'نشط',`${u.username===ME.username?'<span>الحساب الحالي</span>':`<button class="s" onclick="editLocalUser(${u.id})">تعديل البيانات</button><button class="s" onclick="toggleLocalUser(${u.id})">${u.active===false?'تفعيل':'تعطيل'}</button><button class="d" onclick="resetLocalPassword(${u.id})">تغيير كلمة المرور</button><button class="d" onclick="deleteLocalUser(${u.id})">حذف</button>`}`]))}</div>`};
async function createLocalUserFromSettings(){try{await addLocalUser($('#nuName').value,$('#nuUser').value,$('#nuPass').value,$('#nuRole').value);toast('تمت إضافة المستخدم في Firebase');await go('settings')}catch(e){toast(e.message,1)}}
async function editLocalUser(id){try{const us=await all('users'),u=us.find(x=>x.id===id);if(!u)return;const name=prompt('الاسم الظاهر:',u.name);if(name===null)return;if(!name.trim())throw Error('الاسم مطلوب');const username=normalizeUsername(prompt('اسم المستخدم:',u.username));if(!username||! /^[a-z0-9][a-z0-9._-]{2,29}$/.test(username))throw Error('اسم الدخول غير صالح');if(us.some(x=>x.id!==id&&x.username===username))throw Error('اسم المستخدم مستخدم بالفعل');const role=prompt('الدور: admin / owner / chef / accountant',u.role);if(!['admin','owner','chef','accountant'].includes(role))throw Error('الدور غير صالح');if(u.role==='admin'&&u.active!==false&&role!=='admin'&&us.filter(x=>x.role==='admin'&&x.active!==false).length===1)throw Error('لا يمكن تغيير دور آخر مدير نشط');u.name=name.trim();u.username=username;u.role=role;await new Promise((res,rej)=>{const t=DB.transaction('users','readwrite');t.objectStore('users').put(u);t.oncomplete=res;t.onerror=()=>rej(t.error)});await cloudWriteStore('users');toast('تم تعديل بيانات المستخدم');await go('settings')}catch(e){toast(e.message,1)}}
async function deleteLocalUser(id){try{const us=await all('users'),u=us.find(x=>x.id===id);if(!u)return;if(u.username===ME.username)throw Error('لا يمكنك حذف حسابك الحالي');if(u.role==='admin'&&u.active!==false&&us.filter(x=>x.role==='admin'&&x.active!==false).length===1)throw Error('يجب الاحتفاظ بمدير نشط واحد على الأقل');if(!confirm('تأكيد حذف المستخدم '+u.username+'؟'))return;await new Promise((res,rej)=>{const t=DB.transaction('users','readwrite');t.objectStore('users').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)});await cloudWriteStore('users');toast('تم حذف المستخدم');await go('settings')}catch(e){toast(e.message,1)}}
async function toggleLocalUser(id){try{const us=await all('users'),u=us.find(x=>x.id===id);if(!u)return;if(u.username===ME.username)throw Error('لا يمكنك تعطيل حسابك أثناء تسجيل الدخول');if(u.role==='admin'&&u.active!==false&&us.filter(x=>x.role==='admin'&&x.active!==false).length===1)throw Error('يجب الاحتفاظ بمدير نشط واحد على الأقل');u.active=u.active===false;await new Promise((res,rej)=>{const t=DB.transaction('users','readwrite');t.objectStore('users').put(u);t.oncomplete=res;t.onerror=()=>rej(t.error)});await cloudWriteStore('users');await go('settings')}catch(e){toast(e.message,1)}}
async function resetLocalPassword(id){try{const p=prompt('أدخل كلمة المرور الجديدة (8 أحرف على الأقل)');if(!p)return;if(p.length<8)throw Error('كلمة المرور يجب ألا تقل عن 8 أحرف');const us=await all('users'),u=us.find(x=>x.id===id);if(!u)return;u.salt=makeSalt();u.passwordHash=await passwordHash(p,u.salt);await new Promise((res,rej)=>{const t=DB.transaction('users','readwrite');t.objectStore('users').put(u);t.oncomplete=res;t.onerror=()=>rej(t.error)});await cloudWriteStore('users');toast('تم تغيير كلمة المرور في Firebase')}catch(e){toast(e.message,1)}}
async function bk(){dl('E2_backup_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json',JSON.stringify(await E.dump()),'application/json');toast('تم تنزيل النسخة')}
async function rs(f){try{const j=JSON.parse(await f.text()),s=E.check(j);if(!confirm('سيتم استبدال كل البيانات الحالية بـ:\n'+s+'\nسيتم تنزيل نسخة من البيانات الحالية أولًا. متابعة؟'))return;await bk();await E.restore(j,ME);toast('تمت الاستعادة، سيُعاد التحميل');setTimeout(()=>location.reload(),1200)}catch(e){toast(e.message,1)}}
async function vf(){const b=await E.verify();toast(b.length?'اختلاف في: '+b.join(', '):'الأرصدة مطابقة لدفتر الحركة',!!b.length)}

window.addEventListener('error',function(ev){console.error('E2 startup error:',ev.error||ev.message);const l=document.getElementById('login'),a=document.getElementById('app');if(l&&!ME){l.hidden=false;if(!l.innerHTML.trim())l.innerHTML='<h2>E2 Cost Control</h2><p>حصل خطأ أثناء بدء النظام.</p><button onclick="location.reload()">إعادة المحاولة</button>';if(a)a.hidden=true}});boot().catch(function(err){console.error('E2 boot failed:',err);const l=document.getElementById('login'),a=document.getElementById('app');if(l){l.hidden=false;l.innerHTML='<h2>E2 Cost Control</h2><p>تعذر بدء النظام: '+String(err&&err.message||err).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</p><button onclick="location.reload()">إعادة المحاولة</button>'}if(a)a.hidden=true});
</script></body></html>
